# /etc/dovecot/conf.d/10-auth.conf — Autenticación en Dovecot

# Mecanismos de autenticación aceptados
# plain: usuario + contraseña en texto (cifrado por TLS)
# login: LOGIN command de SMTP (base64 encoded, equivalente a plain)
disable_plaintext_auth = no

# Habilitar mecanismos
auth_mechanisms = plain login

# Incluir la autenticación del sistema (/etc/passwd, /etc/shadow)
!include auth-system.conf.ext

# Permitir que Postfix se autentique via el socket de Dovecot
# (configurado en main.cf con smtpd_sasl_path = private/auth)
service auth {
  unix_listener /var/run/dovecot/auth-master {
    mode = 0600
    user = dovecot
    group = dovecot
  }
}
