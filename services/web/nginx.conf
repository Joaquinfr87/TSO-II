# ==============================================================================
# Servidor Web Nginx - TSO-II
# ==============================================================================

# 1. Proxy inverso para CUPS (Servidor de Impresión)
server {
    listen 80;
    server_name print.sudoers.local;

    location / {
        proxy_pass http://tso-print:631;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Virtual Host para el sitio principal
server {
    listen 80;
    server_name web.sudoers.local www.sudoers.local sudoers.local;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# 3. Servidor por defecto (acceso por IP o dominios no declarados)
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

