# ==============================================================================
# Servidor Web Nginx - TSO-II
# ==============================================================================

# Soporte de WebSocket para Portainer
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Configuración TLS global
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# 1. Proxy inverso para CUPS (Servidor de Impresión)
server {
    listen 80;
    server_name print.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name print.sudoers.lan;

    ssl_certificate     /etc/ssl/certs/web.pem;
    ssl_certificate_key /etc/ssl/private/web.key;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cups_upstream http://tso-print:631;
        proxy_pass $cups_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Proxy inverso para Servidor de Archivos Web (Filebrowser)
server {
    listen 80;
    server_name files.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name files.sudoers.lan;

    ssl_certificate     /etc/ssl/certs/web.pem;
    ssl_certificate_key /etc/ssl/private/web.key;

    client_max_body_size 500M;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $files_upstream http://tso-files:80;
        proxy_pass $files_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Proxy inverso para Portainer (Panel de gestión Docker)
server {
    listen 80;
    server_name portainer.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portainer.sudoers.lan;

    ssl_certificate     /etc/ssl/certs/web.pem;
    ssl_certificate_key /etc/ssl/private/web.key;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $portainer_upstream http://tso-portainer:9000;
        proxy_pass $portainer_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

# 4. Proxy inverso para Zabbix (Monitoreo)
server {
    listen 80;
    server_name zabbix.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zabbix.sudoers.lan;

    ssl_certificate     /etc/ssl/certs/web.pem;
    ssl_certificate_key /etc/ssl/private/web.key;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $zabbix_upstream http://tso-zabbix-web:8080;
        proxy_pass $zabbix_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 5. Virtual Host para el sitio principal
server {
    listen 80;
    server_name web.sudoers.lan www.sudoers.lan sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name web.sudoers.lan www.sudoers.lan sudoers.lan;

    ssl_certificate     /etc/ssl/certs/web.pem;
    ssl_certificate_key /etc/ssl/private/web.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# 6. Servidor por defecto (acceso por IP o dominios no declarados)
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/web.pem;
    ssl_certificate_key /etc/ssl/private/web.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}