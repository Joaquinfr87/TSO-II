[global]
    workgroup = WORKGROUP
    server string = Servidor de archivos TSO-II
    security = user
    map to guest = bad user
    server role = standalone server
    log file = /var/log/samba/log.%m
    max log size = 1000

[compartido]
    path = /srv/share
    browseable = yes
    writable = yes
    guest ok = no
    create mask = 0644
    directory mask = 0755