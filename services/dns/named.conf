// named.conf — configuración básica de Bind9
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };
    recursion yes;
    allow-query { any; };
    dnssec-validation auto;

    forwarders {
        1.1.1.1;
    };
};

zone "${DNS_DOMAIN}" {
    type primary;
    file "/etc/bind/zones/db.${DNS_DOMAIN}";
};