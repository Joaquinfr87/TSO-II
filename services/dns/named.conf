// named.conf — configuración de Bind9 para sudoers.lan
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };
    recursion yes;
    allow-query { any; };
    dnssec-validation auto;

    forwarders {
        1.1.1.1;
    };
};

// Zona directa
zone "sudoers.lan" {
    type primary;
    file "/etc/bind/zones/db.sudoers.lan";
};

// Zona inversa para 192.168.1.0/24
zone "1.168.192.in-addr.arpa" {
    type primary;
    file "/etc/bind/zones/db.1.168.192";
};