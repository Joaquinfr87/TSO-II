// kea-dhcp4.conf — configuración básica del servidor DHCP
{
    "Dhcp4": {
        "interfaces-config": {
            "interfaces": ["*"]
        },
        "lease-database": {
            "type": "memfile",
            "lfc-interval": 3600
        },
        "subnet4": [
            {
                "subnet": "${DHCP_SUBNET}",
                "pools": [
                    { "pool": "192.168.1.100 - 192.168.1.200" }
                ],
                "option-data": [
                    { "name": "domain-name-servers", "data": "${DHCP_DNS}" },
                    { "name": "domain-name", "data": "${DNS_DOMAIN}" },
                    { "name": "routers", "data": "${HOST_IP}" }
                ]
            }
        ],
        "loggers": [
            {
                "name": "kea-dhcp4",
                "output_options": [
                    { "output": "stdout" }
                ],
                "severity": "INFO"
            }
        ]
    }
}