# /etc/cups/cupsd.conf — Configuración del servidor CUPS
#
# Configuración para entorno de laboratorio: acceso desde la red local.
# La interfaz de administración requiere autenticación Basic
# (usuario del grupo lpadmin, creado en entrypoint.sh).
#
# Restricción por red:
#   - Imprimir (envío de trabajos): permitido a toda la red.
#   - Administración (/admin y operaciones de gestión): SOLO desde la
#     red administrativa 192.168.0.0/24.
#
# Nota: dentro del contenedor, el tráfico que llega vía el proxy de
# nginx se ve originado desde la subred Docker (tso-net), por eso las
# rutas de administración incluyen también 172.16.0.0/12. La IP real
# del cliente se sigue controlando de forma confiable en el firewall
# del host (server/nftables.conf), que ve la IP antes del NAT.

# Escuchar en todas las interfaces (necesario dentro de un contenedor)
Port 631

# Logging
ErrorLog /dev/stderr
AccessLog /dev/stderr
LogDir /var/log/cups
PageLogDir /var/log/cups

# Permitir acceso web a la interfaz de administración
WebInterface Yes

# Archivos de configuración de impresoras y colas
ServerAlias *
DefaultAuthType Basic

# --- Permisos globales ---
# Imprimir y consultar estado: permitido a toda la red
<Location />
  Order allow,deny
  Allow all
</Location>

# --- Administración: solo red administrativa ---
<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 192.168.0.0/24
  Allow from 172.16.0.0/12
  Deny from all
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 192.168.0.0/24
  Allow from 172.16.0.0/12
  Deny from all
</Location>

# --- Política por defecto ---
# Las operaciones de administración web requieren autenticación.
# El entrypoint.sh ejecuta lpadmin/cupsenable/cupsaccept antes de exponer el servicio.
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
    Allow all
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Order deny,allow
    Allow all
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow from 192.168.0.0/24
    Allow from 172.16.0.0/12
    Deny from all
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow from 192.168.0.0/24
    Allow from 172.16.0.0/12
    Deny from all
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Order deny,allow
    Allow all
  </Limit>

  <Limit All>
    Order deny,allow
    Allow all
  </Limit>
</Policy>
