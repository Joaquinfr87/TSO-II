# docker-compose.yml — Punto de entrada del proyecto TSO-II
#
# Declara todos los servicios del proyecto. La fuente de verdad es este archivo.
# Cada servicio tiene su definición (Dockerfile y configuración) en services/<nombre>.
#
# Uso:
#   docker compose up -d --build        levantar todo
#   docker compose up -d <servicio>      levantar un servicio puntual
#   docker compose down                  detener (sin borrar datos)
#
# Variables de entorno por máquina: copiar .env.example a .env y completar.
# Ver: docs/guides/docker-compose-flujo.md y teams/

name: tso-ii

services:
  # ------------------------------------------------------------------
  # Red compartida entre los servicios del proyecto
  # ------------------------------------------------------------------
  # Los contenedores se comunican entre sí por el nombre de servicio
  # (ej: http://dns)

  # ------------------------------------------------------------------
  # DNS (Bind9) — Joaquín
  # ------------------------------------------------------------------
  dns:
    build: ./services/dns
    container_name: tso-dns
    restart: unless-stopped
    # 53/udp: resolución DNS para la red local
    # 53/tcp: transferencias de zona
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      DNS_DOMAIN: ${DNS_DOMAIN:-sudoers.lan}
      DNS_IP_WLO1: ${DNS_IP_WLO1:-}
      DNS_IP_ENO1: ${DNS_IP_ENO1:-}
    volumes:
      - dns_zones:/etc/bind/zones
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # DHCP (Kea) — Nicolás
  # ------------------------------------------------------------------
  dhcp:
    build: ./services/dhcp
    container_name: tso-dhcp
    restart: unless-stopped
    # network_mode: host -> Kea escucha directo en las interfaces físicas del server.
    # Es la única forma en WiFi (wlo1): el OFFER/ACK sale con la MAC real del server.
    # (Con bridge o macvlan el AP descarta las respuestas con MAC virtual desconocida)
    network_mode: host
    environment:
      DHCP_SUBNET: ${DHCP_SUBNET:-192.168.1.0/24}
      DHCP_POOL: ${DHCP_POOL:-192.168.1.100 - 192.168.1.200}
      DHCP_DNS: ${DHCP_DNS:-192.168.1.10}
      DNS_DOMAIN: ${DNS_DOMAIN:-sudoers.lan}
      DHCP_ROUTER: ${DHCP_ROUTER:-${HOST_IP:-192.168.1.10}}
      DHCP_INTERFACE: ${DHCP_INTERFACE:-wlo1}
    volumes:
      - dhcp_state:/var/lib/kea

  # ------------------------------------------------------------------
  # Base de datos (PostgreSQL) — Nicolás
  # ------------------------------------------------------------------
  database:
    build: ./services/database
    container_name: tso-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tso}
      POSTGRES_DB: ${POSTGRES_DB:-tso}
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # Servidor web (Nginx) — David
  # ------------------------------------------------------------------
  web:
    build: ./services/web
    container_name: tso-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${WEB_PORT_HTTP:-8080}:80"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-sudoers.lan}
    volumes:
      - ${WEB_SITE_DIR:-./services/web/public}:/usr/share/nginx/html:ro
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # Servidor de archivos (Samba) — David
  # ------------------------------------------------------------------
  files:
    build: ./services/files
    container_name: tso-files
    privileged: true
    restart: unless-stopped
    ports:
      - "${SMB_PORT_445:-445}:445"
      - "139:139"
      - "${FILES_WEB_PORT:-8082}:80"
      - "2049:2049"
      - "2049:2049/udp"
      - "111:111"
      - "111:111/udp"
    volumes:
      - ${FILES_SHARE_DIR:-./services/files/data}:/srv/share
      - files_db:/database
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # Servidor de correo (Postfix + Dovecot) — Joaquín
  # ------------------------------------------------------------------
  mail:
    build: ./services/mail
    container_name: tso-mail
    restart: unless-stopped
    ports:
      - "25:25"        # SMTP (transferencia entre servidores)
      - "587:587"      # SMTP Submission (clientes con auth)
      - "110:110"      # POP3 (Dovecot)
      - "143:143"      # IMAP (Dovecot)
      - "993:993"      # IMAPS (IMAP cifrado)
      - "995:995"      # POP3S (POP3 cifrado)
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-mail.sudoers.lan}
    volumes:
      - mail_data:/var/mail
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # Servidor de impresión (CUPS + impresora virtual PDF)
  # ------------------------------------------------------------------
  print:
    build: ./services/print
    container_name: tso-print
    restart: unless-stopped
    ports:
      - "${CUPS_PORT:-1631}:631"
    environment:
      CUPS_ADMIN_USER: ${CUPS_ADMIN_USER:-admin}
      CUPS_ADMIN_PASS: ${CUPS_ADMIN_PASS:-admin}
    volumes:
      - print_output:/var/spool/cups-pdf/OUT
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # Monitoreo (Zabbix 7.4) — Joaquín
  # ------------------------------------------------------------------
  # Stack completo: PostgreSQL + Server + Web (Nginx) + Agent2 (Docker).
  # Acceso: https://zabbix.sudoers.lan (via reverse proxy nginx, cert autofirmado).
  # Agentes: 10051/tcp para conexiones activas de agentes.
  zabbix-db:
    image: postgres:16-alpine
    container_name: tso-zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      POSTGRES_DB: zabbix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZABBIX_DB_USER:-zabbix} -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - zabbix_db_data:/var/lib/postgresql/data
    networks:
      - tso-net

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.4-ubuntu-latest
    container_name: tso-zabbix-server
    restart: unless-stopped
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    networks:
      - tso-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.4-ubuntu-latest
    container_name: tso-zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      POSTGRES_DB: zabbix
      PHP_TZ: America/Argentina/Buenos_Aires
    networks:
      - tso-net

  zabbix-agent-docker:
    image: zabbix/zabbix-agent2:7.4-ubuntu-latest
    container_name: tso-zabbix-agent-docker
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: tso-docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tso-net

  # ------------------------------------------------------------------
  # Portainer (Panel web de gestión de Docker) — Joaquín
  # ------------------------------------------------------------------
  # Interfaz web para administrar contenedores, imágenes, volúmenes y redes.
  # Acceso: https://<IP-del-servidor>:9443  (HTTPS, certificado autofirmado)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: tso-portainer
    restart: unless-stopped
    ports:
      - "8000:8000"                      # Agente Edge / túnel remoto
      - "${PORTAINER_PORT:-9443}:9443"   # UI web (HTTPS)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - tso-net

# Volúmenes con nombre: los datos persisten aunque los contenedores se borren.
volumes:
  dns_zones:
  dhcp_state:
  mail_data:
  print_output:
  db_data:
  files_db:
  zabbix_db_data:
  portainer_data:

# Red interna del proyecto.
networks:
  tso-net:
    driver: bridge

# NOTA sobre IIS y controlador de dominio:
# IIS y un controlador de dominio con Active Directory son tecnologías de
# Microsoft pensadas para el kernel de Windows. Docker sobre Debian usa el
# kernel de Linux, por lo que esos roles NO pueden desplegarse como
# contenedores en esta máquina.
# - Ver la discusión completa y alternativas en teams/reparticion-tareas.md.