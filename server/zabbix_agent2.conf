# ===================================================================
# zabbix_agent2.conf — Configuración del agente Zabbix en el host Debian.
#
# Este archivo se versiona aquí y se copia a /etc/zabbix/zabbix_agent2.conf
# por server/deploy.sh. El agente se instala vía apt (paquete zabbix-agent2).
#
# El server (contenedor tso-zabbix-server) publica el puerto 10051 en el host,
# por eso ServerActive apunta a 127.0.0.1 (loopback del propio host).
# ===================================================================

# IP/hostname del server Zabbix para CHEQUEOS PASIVOS (server pregunta al agente)
Server=127.0.0.1

# IP/hostname del server Zabbix para CHEQUEOS ACTIVOS (el agente se conecta)
ServerActive=127.0.0.1

# Nombre del host tal como se va a registrar en la UI de Zabbix
Hostname=ts-server

# Permitir reinicios/acciones controladas desde Zabbix (opcional).
# Comentado por defecto por seguridad. Descomentar si se quiere
# que Zabbix pueda ejecutar comandos (requiere UserParameter).
# AllowKey=system.run[*]
# UnsafeUserParameters=1

# Logs
LogFile=/var/log/zabbix/zabbix_agent2.log
LogFileSize=1