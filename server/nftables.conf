# ===================================================================
# nftables — Firewall del servidor TSO-II (Debian 13 Trixie)
# ===================================================================
# Aplicar en el servidor:
#   sudo bash server/deploy.sh
#
# Verificar:
#   sudo nft list ruleset
#
# Reds del servidor:
#   wlo1 (192.168.0.0/24)  — red administrativa (SSH, acceso total)
#   eno1 (192.168.20.0/24) — red de servicios (usuarios)
#
# ATENCIÓN: NO usar "flush ruleset" en este archivo. Docker crea sus
# propias cadenas (DOCKER, DOCKER-USER, NAT) y un flush global las
# borra, rompiendo el mapeo de puertos de los contenedores.
# Este config solo define la tabla `inet filter`; deploy.sh borra
# únicamente ESA tabla antes de recargar.
# ===================================================================

table inet filter {

    # ─────────────────────────────────────────────
    # Conjuntos de IPs
    # ─────────────────────────────────────────────
    set admin_ips {
        type ipv4_addr
        flags interval
        elements = { 192.168.0.0/24 }
    }

    set user_net {
        type ipv4_addr
        flags interval
        elements = { 192.168.20.0/24, 192.168.0.0/24 }
    }

    # ─────────────────────────────────────────────
    # INPUT: tráfico entrante al host
    # ─────────────────────────────────────────────
    chain input {
        type filter hook input priority filter; policy drop;

        # Conexiones ya establecidas
        ct state established,related accept

        # Loopback
        iif "lo" accept

        # ICMP (ping)
        ip protocol icmp accept

        # ─── SSH (solo desde red admin wlo1) ───
        tcp dport 22 ip saddr @admin_ips accept

        # ─── DNS ───
        tcp dport 53 accept
        udp dport 53 accept

        # ─── DHCP ───
        udp dport 67 accept

        # ─── HTTP — nginx reverse proxy ───
        tcp dport { 80, 8080 } accept

        # ─── Portainer directo (solo admin) ───
        tcp dport { 9443, 8000 } ip saddr @admin_ips accept

        # ─── Correo — IMAP / SMTP / POP3 ───
        tcp dport { 25, 110, 143, 587, 993, 995 } accept

        # ─── PostgreSQL (solo admin) ───
        tcp dport 5432 ip saddr @admin_ips accept

        # ─── Samba / NFS (red de usuarios) ───
        tcp dport { 139, 445, 111, 2049 } ip saddr @user_net accept
        udp dport { 111, 2049 } ip saddr @user_net accept

        # ─── CUPS admin (solo red admin; imprimir va por proxy nginx :80) ───
        tcp dport 1631 ip saddr @admin_ips accept

        # Log + drop el resto (rate limit para no llenar logs)
        log prefix "[nft-drop] " limit rate 5/minute drop
    }

    # ─────────────────────────────────────────────
    # FORWARD: Docker necesita chain abierta
    # ─────────────────────────────────────────────
    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    # ─────────────────────────────────────────────
    # OUTPUT: tráfico saliente (abierto)
    # ─────────────────────────────────────────────
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
